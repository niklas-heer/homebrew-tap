name: Kindred formula

on:
  push:
    branches: [main]
    paths:
      - Formula/kindred.rb
      - .github/workflows/kindred.yml
  pull_request:
    paths:
      - Formula/kindred.rb
      - .github/workflows/kindred.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Fetch the public tap at the tested commit
        run: |
          brew tap niklas-heer/tap
          tap_dir="$(brew --repository niklas-heer/tap)"
          git -C "$tap_dir" fetch origin "$GITHUB_SHA"
          git -C "$tap_dir" checkout --detach "$GITHUB_SHA"
          test "$(git -C "$tap_dir" rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check formula style and metadata
        run: |
          brew style niklas-heer/tap/kindred
          brew audit --strict --online niklas-heer/tap/kindred
      - name: Install the published release and test an archive
        run: |
          brew install niklas-heer/tap/kindred
          kindred --version
          brew test niklas-heer/tap/kindred
          brew audit --strict --online niklas-heer/tap/kindred
