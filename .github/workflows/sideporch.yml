name: Update Sideporch

on:
  schedule:
    - cron: '53 * * * *'
  workflow_dispatch:
  pull_request:
    paths: ['Formula/sideporch.rb', 'scripts/*sideporch*', '.github/workflows/sideporch.yml']

permissions:
  contents: read

concurrency:
  group: sideporch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.generate.outputs.changed }}
      published: ${{ steps.generate.outputs.published }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: ruby scripts/test-sideporch-formula.rb
      - name: Generate candidate from the published release
        id: generate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Until Sideporch publishes its first release there is nothing to
          # render. Any other API failure fails the check.
          if ! gh api repos/niklas-heer/sideporch/releases/latest > release.json 2> api-error.txt; then
            if grep -q 'HTTP 404' api-error.txt; then
              echo 'No published Sideporch release yet'
              echo 'changed=false' >> "$GITHUB_OUTPUT"
              echo 'published=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cat api-error.txt >&2
            exit 1
          fi
          echo 'published=true' >> "$GITHUB_OUTPUT"
          release_tag=$(jq -r .tag_name release.json)
          gh release download "$release_tag" --repo niklas-heer/sideporch --pattern SHA256SUMS
          ruby scripts/sideporch-formula.rb release.json SHA256SUMS > Formula/sideporch.rb
          if git ls-files --error-unmatch Formula/sideporch.rb >/dev/null 2>&1 && git diff --quiet -- Formula/sideporch.rb; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v7.0.1
        if: steps.generate.outputs.published == 'true'
        with:
          name: sideporch-formula
          path: Formula/sideporch.rb

  install:
    needs: prepare
    if: needs.prepare.outputs.published == 'true' && (needs.prepare.outputs.changed == 'true' || github.event_name != 'schedule')
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Homebrew/actions/setup-homebrew@848c272c7bfe984a197bd4d16383f4c106ec61e6
        with:
          stable: true
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sideporch-formula
          path: Formula
      - name: Install and test the candidate formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          tap_formula="$(brew --repository niklas-heer/tap)/Formula/sideporch.rb"
          if ! [ Formula/sideporch.rb -ef "$tap_formula" ]; then
            cp Formula/sideporch.rb "$tap_formula"
          fi
          brew install niklas-heer/tap/sideporch
          brew test niklas-heer/tap/sideporch
      - name: Check formula style and metadata
        if: matrix.runner == 'macos-15'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          brew style niklas-heer/tap/sideporch
          brew audit --strict --online niklas-heer/tap/sideporch

  publish:
    name: Open verified update PR
    needs: [prepare, install]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          name: sideporch-formula
          path: Formula
      - name: Propose the verified formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's#.*/releases/download/v\([0-9.]*\)/.*#\1#p' Formula/sideporch.rb | head -n 1)
          test -n "$version"
          branch="update/sideporch-$version"
          # A closed update PR means the version was declined; do not propose it again.
          if [ "$(gh pr list --state all --head "$branch" --json number --jq length)" -gt 0 ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add Formula/sideporch.rb
          git diff --cached --quiet && exit 0
          git commit -m 'chore(sideporch): update verified release'
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(sideporch): update to $version" --body "Verified checksums and native Homebrew installation tests on macOS and Linux, ARM64 and x86-64. Review and merge to publish the formula update."
